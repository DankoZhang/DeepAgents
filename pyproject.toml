# Project metadata and tool configuration

[project]
name = "deepagents-demo"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.6.12",
    "langchain>=1.3.13",
    "langchain-anthropic>=1.4.8",
    "langchain-openai>=1.3.5",
    "langgraph-checkpoint-redis>=0.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "rich>=15.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "langchain-mcp-adapters>=0.3.0",
    "alembic>=1.18.5",
    "cryptography>=44.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-requests>=2.32.0",
]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# ── Ruff（# noqa: BLE001 等规则码在此生效）────────────────────────────────

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["deepagents_app", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "BLE",
    "ARG",
    "ANN001",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN001", "ARG"]
"migrations/**" = ["ANN001", "I001", "E402"]

# ── mypy（# type: ignore[...] 在此生效）──────────────────────────────────

[tool.mypy]
python_version = "3.13"
packages = ["deepagents_app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
check_untyped_defs = false
disallow_untyped_defs = false
pretty = true

[[tool.mypy.overrides]]
module = [
    "deepagents.*",
    "langgraph.*",
    "langchain.*",
    "langchain_openai.*",
    "langchain_anthropic.*",
]
ignore_missing_imports = true

# ── pytest ───────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
