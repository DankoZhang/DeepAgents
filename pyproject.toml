# Project metadata and tool configuration

[project]
name = "deepagents-app"
version = "0.2.0"
description = "DeepAgents methodology-driven multi-agent platform (backend)"
readme = "README.md"
# 仅支持 3.13，避免 uv 为 3.14+/win32 等无关环境解析
requires-python = ">=3.13,<3.14"
dependencies = [
    # Agent / LLM
    "deepagents>=0.6.12",
    "langchain>=1.3.13",
    "langchain-anthropic>=1.4.8",
    "langchain-openai>=1.3.5",
    "langchain-mcp-adapters>=0.3.0",
    "langgraph-checkpoint-redis>=0.1.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "httpx>=0.27.0",
    # Config / crypto
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "cryptography>=44.0.0",
    # DB
    "sqlalchemy>=2.0.36",
    "alembic>=1.18.5",
    "psycopg[binary]>=3.2.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    # Redis 客户端（checkpoint / 缓存失效 pub/sub / SSE 全局限流直接使用）
    "redis>=5.0.0",
    "fastmcp>=3.4.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deepagents_app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]

# 默认阿里云镜像（清华源当前易 403）；需要官方源时改 default
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

# [[tool.uv.index]]
# name = "pypi"
# url = "https://pypi.org/simple"
# default = true

# ── pytest ───────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]
