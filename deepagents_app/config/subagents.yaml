# SubAgent 声明式配置
# ====================
# 构建 Deep Agent graph 时由 loader 自动加载（见 Settings.subagents_config）。
#
# 字段说明：
#   name               — 唯一标识；主 Agent 通过 task(subagent_type=name) 调用
#   description        — 给主 Agent 看的「何时委派」说明（注入 task 工具描述）
#   system_prompt      — 内联系统提示（与 system_prompt_file 二选一）
#   system_prompt_file — 相对本 YAML 所在目录的提示词文件路径
#   tools              — 工具包名（见 registry.TOOL_KITS）或工具包名列表
#   skills             — 专属 skills 虚拟路径列表
#   middleware         — 中间件名列表（见 registry.MIDDLEWARE_REGISTRY）
#   model              — 可选，覆盖主 Agent 模型
#   enabled            — 默认 true；设为 false 可临时禁用
#
# 新增 SubAgent：在下方追加条目，并在 registry.py 登记新工具包（如需）。

subagents:
  - name: document-writer
    description: >-
      文档撰写专家。适用于：撰写/改写 README、技术方案、会议纪要、
      报告、说明书等 Markdown 文档，并将结果保存到工作区。
    system_prompt_file: prompts/document-writer.md
    tools: document
    skills:
      - /skills/document-writer/
    middleware:
      - logging
      - timing

  - name: computer-operator
    description: >-
      计算机操作专家。适用于：浏览 workspace、读写文件、
      执行白名单内的 shell 命令（ls/python/grep 等），返回可复核的执行结果。
    system_prompt_file: prompts/computer-operator.md
    tools: computer
    skills:
      - /skills/computer-operator/
    middleware:
      - logging
      - timing
      - audit

  - name: qa-expert
    description: >-
      智能问答专家。适用于：解释概念、对比方案、检索演示知识库、
      回答关于 Deep Agents / Middleware / Memory / Skills 等问题。
    system_prompt_file: prompts/qa-expert.md
    tools: qa
    skills:
      - /skills/qa-expert/
    middleware:
      - logging
